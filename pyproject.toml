[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind"
version = "0.1.0"
description = "DocMind — multimodal invoice intelligence & audit platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "pymupdf>=1.24",
    "networkx>=3.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "opencv-python>=4.9",
    "reportlab>=4.2",
    "qrcode>=7.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
